name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAOA-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "PAOA Latest Build"
          body: |
            Automated build of PAOA (Personal AI Operating Assistant).
            
            ### Direct Download:
            Download **`PAOA-debug.apk`** below directly onto your Android device to install or update the app.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
