<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F17" />
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" stroke="url(#neon)" stroke-width="8" stroke-dasharray="16 12" fill="none" opacity="0.4" />
  
  <!-- Central Neural AI core symbol -->
  <g filter="url(#glow)">
    <polygon points="256,120 370,186 370,318 256,384 142,318 142,186" fill="none" stroke="url(#neon)" stroke-width="14" stroke-linejoin="round" />
    <circle cx="256" cy="256" r="44" fill="url(#neon)" />
    <circle cx="256" cy="120" r="14" fill="#00F0FF" />
    <circle cx="370" cy="186" r="14" fill="#00F0FF" />
    <circle cx="370" cy="318" r="14" fill="#6366F1" />
    <circle cx="256" cy="384" r="14" fill="#6366F1" />
    <circle cx="142" cy="318" r="14" fill="#6366F1" />
    <circle cx="142" cy="186" r="14" fill="#00F0FF" />
  </g>
</svg>
